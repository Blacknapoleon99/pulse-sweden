name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: tryggpuls_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRYGGPULS_LOAD_ENVFILE: "false"
      TRYGGPULS_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/tryggpuls_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check:all
      - run: npm test
      - run: npm run test:mobile
      - run: npm run test:feeds
      - run: npm run check:render
      - run: npm audit --audit-level=moderate
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:restore
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run test:navigation
      - run: npx expo install --check
      - run: npm run export:check
      - run: npm audit --audit-level=moderate
