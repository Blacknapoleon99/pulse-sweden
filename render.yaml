services:
  - type: web
    name: tryggpuls
    repo: https://github.com/Blacknapoleon99/pulse-sweden
    branch: demo-polish-release
    region: oregon
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tryggpuls-family
          property: connectionString
      - key: CARTO_BASEMAP_API_KEY
        sync: false
      - key: TRAFIKVERKET_API_KEY
        sync: false
      - key: ZONE_ADMIN_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: FAMILY_PREVIEW_MODE
        value: "true"

databases:
  - name: tryggpuls-family
    region: oregon
    plan: free
