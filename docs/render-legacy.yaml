services:
  - type: web
    name: tryggpuls
    repo: https://github.com/Blacknapoleon99/pulse-sweden
    branch: demo-polish-release
    region: oregon
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tryggpuls-family
          property: connectionString
      - key: CARTO_BASEMAP_API_KEY
        sync: false
      - key: TRAFIKVERKET_API_KEY
        sync: false
      - key: ZONE_ADMIN_TOKEN
        sync: false
      - key: ZONE_ADMIN_TOKENS_JSON
        sync: false
      - key: BANKID_ENV
        value: test
      - key: BANKID_CERT_PATH
        sync: false
      - key: BANKID_CERT_PASSPHRASE
        sync: false
      - key: BANKID_CA_CERT_PATH
        sync: false
      - key: BANKID_USER_HASH_KEY
        sync: false
      - key: BANKID_TRUST_PROXY
        value: "true"
      - key: BANKID_RETURN_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: FAMILY_PREVIEW_MODE
        value: "true"
      - key: FOUNDRY_BASE_URL
        sync: false
      - key: FOUNDRY_CLIENT_ID
        sync: false
      - key: FOUNDRY_CLIENT_SECRET
        sync: false
      - key: FOUNDRY_SUMMARIES_DATASET_RID
        sync: false
      - key: FOUNDRY_SUMMARIES_BRANCH
        value: master
      - key: FOUNDRY_SUMMARIES_ENABLED
        value: "false"
      - key: FOUNDRY_SUMMARIES_MAX_AGE_MS
        value: "21600000"

databases:
  - name: tryggpuls-family
    region: oregon
    plan: free
